# Qodo review settings for evergreen-agents (Day 11).
# The project rules live in AGENTS.md; Qodo imports them as platform rules, so no separate
# instruction text is kept here. These keys only make runs comparable and show what was loaded.

[review_agent]
# Pin the review depth so two runs on the same PR are comparable.
override_effort = "standard"

[review_agent_ux]
# Adds a "Context sources" section to reviews that have findings.
show_context_used = true

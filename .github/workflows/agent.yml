name: agent

# Fires when an issue gets the "ready-for-agent" label (added by the repo owner).
# Job 1 runs Codex with a read-only token and produces a patch. Job 2 holds the write
# token, pushes the patch to agent/ticket-<n> and opens a PR. Nothing here merges.
on:
  issues:
    types: [labeled]

concurrency:
  group: agent-ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - name: Fetch the ticket
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          mkdir -p .agent-context
          gh issue view "$ISSUE" --json title -q .title > .agent-context/ticket-title.txt
          gh issue view "$ISSUE" --json body -q .body > .agent-context/ticket-body.md
      - name: Create a low-privilege user for Codex
        run: |
          sudo useradd --create-home --shell /bin/bash codex
          sudo chown -R codex:codex "$GITHUB_WORKSPACE"
      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/agent/implement.md
          sandbox: workspace-write
          safety-strategy: unprivileged-user
          codex-user: codex
          output-file: .agent-context/final.md
      - name: Give the files back to the runner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Collect the patch
        run: |
          git add -A
          git diff --cached --binary > .agent-context/agent.patch
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: |
            .agent-context/agent.patch
            .agent-context/final.md

  open-pr:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: agent/ticket-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: agent-output
          path: out
      - name: Refuse an empty or unsafe patch
        run: |
          if [ ! -s out/agent.patch ]; then
            gh issue edit "$ISSUE" --add-label agent-blocked
            gh issue comment "$ISSUE" --body "The agent produced no changes. Stopping for a person to look. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          if git apply --numstat out/agent.patch | cut -f3 | grep -q '^\.github/'; then
            gh issue edit "$ISSUE" --add-label agent-blocked
            gh issue comment "$ISSUE" --body "The agent tried to change .github/, which AGENTS.md forbids. Stopping for a person to look."
            exit 1
          fi
      - name: Push the branch
        run: |
          git config user.name "evergreen-agent"
          git config user.email "evergreen-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git apply --index out/agent.patch
          git commit -m "Implement #$ISSUE (automated agent run)"
          git push origin "$BRANCH"
      - name: Open the PR
        run: |
          TITLE=$(gh issue view "$ISSUE" --json title -q .title)
          gh issue view "$ISSUE" --json body -q .body > ticket-body.md
          {
            echo "Closes #$ISSUE"
            echo "Ticket: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$ISSUE"
            echo
            echo "## Acceptance criteria (from the ticket)"
            awk '/^## Acceptance criteria/{f=1;next} /^## /{f=0} f' ticket-body.md
            echo
            echo "## Agent's report"
            cat out/final.md
            echo
            echo "Opened automatically by the agent workflow. A person decides whether to merge."
          } > pr-body.md
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md)
          gh issue comment "$ISSUE" --body "Agent opened $URL. Waiting for Qodo's review."

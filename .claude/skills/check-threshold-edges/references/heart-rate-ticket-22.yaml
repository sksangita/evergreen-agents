# Expected heart-rate edges, written from the source ticket, not from the code.
# Source: https://github.com/sksangita/evergreen-agents/issues/22
#   "amber when bpm > 100, red when bpm < 40 or bpm > 130"
#   "100 is green, just above 100 is amber, 130 is amber, just above 130 is red, 40 is green and just below 40 is red"
#   "hr 140 and hr 35: requires_escalation is true"; "hr 128 prints AMBER, escalate no"
# "Just above/below" is 0.01 here (the ticket gives no number).
# The last three green/amber cases are not in the ticket: AGENTS.md rule 4 asks for exactly at and just below
# every threshold, so each threshold gets a case on both sides.
- {bpm: 100, triage: green, escalate: "no"}
- {bpm: 100.01, triage: amber, escalate: "no"}
- {bpm: 128, triage: amber, escalate: "no"}
- {bpm: 130, triage: amber, escalate: "no"}
- {bpm: 130.01, triage: red, escalate: "yes"}
- {bpm: 140, triage: red, escalate: "yes"}
- {bpm: 40, triage: green, escalate: "no"}
- {bpm: 39.99, triage: red, escalate: "yes"}
- {bpm: 35, triage: red, escalate: "yes"}
- {bpm: 99.99, triage: green, escalate: "no"}
- {bpm: 129.99, triage: amber, escalate: "no"}
- {bpm: 40.01, triage: green, escalate: "no"}
- {bpm: 0, exit: 2}
- {bpm: -5, exit: 2}
